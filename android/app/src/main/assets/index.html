/* Native Android / remote AI connection settings */
.connect-panel{background:#f3f1ff;border:1px solid #d6d0ff;border-radius:20px;padding:17px 20px;margin:-7px 0 22px;display:grid;gap:10px}
.connect-panel label{font-weight:800;font-size:14px;color:#423c8a}
.connect-panel .connect-row{display:flex;gap:10px;min-width:0}
.connect-panel input{flex:1;min-width:0;border:1px solid #cbc6ef;border-radius:12px;padding:12px;font:inherit;font-size:14px;background:#fff;color:#282b4b}
.connect-panel small{font-size:12px;line-height:1.5;color:#696885}
@media(max-width:540px){.connect-panel .connect-row{flex-direction:column}.connect-panel .btn{width:100%}}

/* WAYPACK Motion & tactile polish — reduced-motion aware */
:root{--ease-spring:cubic-bezier(.2,.9,.24,1);--ease-out:cubic-bezier(.22,1,.36,1)}
button,[role=button],.activity,.pack-item,.pack-group,.category{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{transition:transform .19s var(--ease-spring),box-shadow .24s var(--ease-out),background .22s ease,border-color .22s ease,opacity .18s ease}
button:active:not(:disabled){transform:scale(.962)}
button:focus-visible,input:focus-visible{outline:3px solid #b7afff;outline-offset:3px}
.activity{transition:transform .24s var(--ease-spring),background .24s ease,box-shadow .24s ease,border-color .24s ease}
.activity:hover{transform:translateY(-2px)}
.activity:active{transform:scale(.975)}
.pack-item{animation:waypackItemIn .35s var(--ease-out) both;transition:background-color .2s ease,border-color .2s ease,transform .22s var(--ease-out)}

let state;try{let saved=JSON.parse(localStorage.getItem('waypack-state-v3')||'null');state=saved&&saved.version===3&&saved.profile&&Array.isArray(saved.activities)&&Array.isArray(saved.items)?{...initial,...saved,step:Math.max(0,Math.min(2,Number(saved.step)||0))}:initial;}catch{state=initial}
let aiAvailable=false,aiLoading=false,aiModel='',toastTimeout,autoAIGeneration=0,autoAIStatus='idle';
const NATIVE_HOST='appassets.androidplatform.net';
const isNative=location.hostname===NATIVE_HOST;
let apiBase='';
function normalizeServerURL(input){
  if(!input)return '';
  try{let u=new URL(input);
    if(u.protocol!=='https:'||u.username||u.password||u.pathname!=='/'||u.search||u.hash)return null;
    return u.origin;
  }catch{return null}
}
try{apiBase=normalizeServerURL(String(localStorage.getItem('waypack-api-base')||'').trim())||''}catch{}
if(isNative)apiBase='';
function endpoint(path){return (apiBase||((isNative||location.protocol==='file:')?'':location.origin))+path}
function needsServerURL(){return !isNative && (location.protocol==='file:'||!aiAvailable||!!apiBase)}

function toast(message){let t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),3100)}
function count(){return {total:state.items.length,done:state.items.filter(x=>x.checked).length}}

function resultPage(){let p=state.profile,c=count(),pct=c.total?Math.round(100*c.done/c.total):0,items=state.items;let groupsArr=Object.entries(G).filter(([id])=>items.some(i=>i.category===id));let groupCards=groupsArr.filter(([id])=>state.filter==='all'||state.filter===id).map(([id,g])=>{let its=items.filter(i=>i.category===id),done=its.filter(x=>x.checked).length;return `<div class="pack-group"><div class="pack-group-head"><span>${g.icon}</span><strong>${g.name}</strong><span class="counter">${done}/${its.length}</span></div>${its.map(it=>`<div class="pack-item ${it.checked?'is-checked':''}"><button class="check" data-toggle="${esc(it.id)}" aria-pressed="${!!it.checked}" aria-label="${it.checked?'Убрать отметку':'Отметить собранным'}: ${esc(it.name)}">✓</button><div class="item-detail"><strong>${it.important?'<span class="important-dot" title="Важно"></span>':''}${esc(it.name)}</strong>${it.why?`<small>${esc(it.why)}</small>`:''}</div><div class="item-controls"><button aria-label="Уменьшить количество ${esc(it.name)}" data-qty="${esc(it.id)}" data-delta="-1">−</button><span title="${esc(it.unit)}">${it.qty}</span><button aria-label="Увеличить количество ${esc(it.name)}" data-qty="${esc(it.id)}" data-delta="1">+</button></div>${it.id.startsWith('custom_')||it.id.startsWith('ai_')?`<button class="delete-item" title="Удалить" aria-label="Удалить ${esc(it.name)}" data-remove="${esc(it.id)}">×</button>`:''}</div>`).join('')}</div>`}).join('');return `<div class="main-area">${progressBar()}<div class="result-top"><div><div class="eyebrow">ТВОЙ ПЕРСОНАЛЬНЫЙ ПЛАН</div><h1>Чемодан почти собран ✨</h1><p>📍 ${esc(p.city)}, ${esc(p.country)} &nbsp;•&nbsp; ${p.days} ${plural(p.days,['день','дня','дней'])} &nbsp;•&nbsp; ${p.people} ${plural(p.people,['человек','человека','человек'])} &nbsp;•&nbsp; ${state.activities.length} ${plural(state.activities.length,['активность','активности','активностей'])}</p></div><div class="result-tools"><button class="btn secondary small" data-action="back-activities">✎ Изменить план</button><button class="btn quiet small" data-action="export">↓ Список .txt</button><button class="btn quiet small" data-action="share">↗ Поделиться</button></div></div><div class="progress-card"><div class="ring" style="background:conic-gradient(#b8aeff ${pct}%,#535b8c ${pct}% 100%)"><strong>${pct}%</strong></div><div class="progress-info"><h3>${pct===100?'Всё собрано! 🎉':'Ты отлично справляешься!'}</h3><p>${pct===100?'Счастливого путешествия!':'Отмечай вещи галочками по мере сборов.'}</p><div class="progress-mini"><span>✓ ${c.done} собрано</span><span>◷ ${c.total-c.done} осталось</span><span>✦ ${c.total} позиций</span></div></div></div><div class="ai-panel ai-autopilot" aria-live="polite" style="margin-bottom:22px"><div><h3>✦ Умная сборка <span class="ai-badge">${aiLoading?'GEMMA АНАЛИЗИРУЕТ':autoAIStatus==='complete'?'ИИ УЧАСТВОВАЛ':autoAIStatus==='error'?'БАЗОВЫЙ СПИСОК':aiAvailable?'GEMMA ГОТОВА':'ПОДГОТОВКА'}</span></h3><p>${aiLoading?'Нейросеть подбирает индивидуальные дополнения — ничего нажимать не нужно.':autoAIStatus==='complete'?'Gemma уже автоматически проверила твой маршрут и дополнила список.':autoAIStatus==='error'?'Базовый список готов. Gemma не смогла ответить — можно продолжить сборы без неё.':'Основные вещи рассчитаны сразу, Gemma дополняет список автоматически, когда доступна.'}</p></div><span class="ai-status-glyph" aria-hidden="true">${aiLoading?'<span class="loading-spin"></span>':'✧'}</span></div>${needsServerURL()?`<div class="connect-panel"><label for="api-base">🔐 Адрес сервера Gemma (HTTPS)</label><div class="connect-row"><input id="api-base" type="url" placeholder="https://your-waypack-server.example" maxlength="220" value="${esc(apiBase)}" autocomplete="url" spellcheck="false"><button type="button" class="btn secondary small" data-action="connect-server">${apiBase?'Проверить':'Подключить'}</button></div><small>API-ключ хранится только на сервере. Здесь вводится адрес сервера, а не ключ. Отправка данны async function exportOrShare(share){let p=state.profile;let lines=[`WAYPACK — ${p.city}, ${p.country} (${p.days} дн.)`,`Активности: ${state.activities.map(id=>A.find(a=>a.id===id)?.label).filter(Boolean).join(', ')}`,''];for(let [k,g] of Object.entries(G)){let its=state.items.filter(i=>i.category===k);if(!its.length)continue;lines.push(g.name.toUpperCase());its.forEach(i=>lines.push(`${i.checked?'[x]':'[ ]'} ${i.name} — ${i.qty} ${i.unit}`));lines.push('')}lines.push('Сформировано в WAYPACK');let text=lines.join('\n');if(window.WaypackNative&&window.WaypackNative.shareText&&share){window.WaypackNative.shareText(text);return}if(window.WaypackNative&&window.WaypackNative.saveText&&!share){window.WaypackNative.saveText(text);return}if(share){if(navigator.share){try{await navigator.share({title:'Мой чемодан — WAYPACK',text});return}catch(err){if(err.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Список скопирован 📋');return}catch(e){toast('Скопировать не удалось; скачай TXT')}}let blob=new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='waypack-list.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);if(!share)toast('Список сохранён 📥')}
async function askAI(generation=autoAIGeneration){if(!aiAvailable||aiLoading)return;aiLoading=true;render();try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),isNative?20000:28000);let response;try{response=await fetch(endpoint('/api/ai'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:state.profile,activities:state.activities,currentItems:state.items.map(i=>({name:i.name,qty:i.qty}))}),signal:controller.signal})}finally{clearTimeout(timer)}let data=await response.json();if(!response.ok)throw Error(data.error||'Не удалось получить рекомендации');if(generation!==autoAIGeneration||state.step!==2)return;let existingNames=new Set(state.items.map(x=>x.name.toLocaleLowerCase('ru-RU'))),added=0;for(let i of data.items||[]){let name=String(i.name||'').trim().slice(0,60),category=G[i.category]?i.category:'other';if(!name||existingNames.has(name.toLocaleLowerCase('ru-RU')))continue;let id='ai_'+Date.now()+'_'+added;state.items.push({id,name,qty:Math.min(15,Math.max(1,Number(i.qty)||1)),category,why:String(i.reason||'Дополнение от Gemma').slice(0,100),important:false,unit:'шт.',checked:false});existingNames.add(name.toLocaleLowerCase('ru-RU'));added++}autoAIStatus='complete';persist();toast(added?`Gemma добавил ${added} ${plural(added,['вещь','вещи','вещей'])} ✨`:'Gemma не нашёл новых необходимых вещей')}catch(error){if(generation===autoAIGeneration)autoAIStatus='error';toast(error.name==='AbortError'?'Gemma не ответил вовремя':String(error.message).slice(0,120))}finally{aiLoading=false;render()}}
$('app').addEventListener('submit',e=>{if(e.target.id!=='add-form')return;e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;let qty=Math.min(99,Math.max(1,Number(fd.get('qty'))||1));state.items.push({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:name.slice(0,60),qty,category:state.filter==='all'?'other':state.filter,why:'Добавлено вручную',important:false,unit:'шт.',checked:false});persist();render();toast('Добавлено в чемодан ✓')});
