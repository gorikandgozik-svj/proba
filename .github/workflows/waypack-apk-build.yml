name: WAYPACK AI Android 1.4
on:
  push:
    branches: [waypack-apk-build]
    paths:
      - 'android/**'
      - '.github/workflows/waypack-apk-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled app scripts and offline features
        run: |
          node <<'NODE'
          const fs = require('fs'), vm = require('node:vm');
          const html = fs.readFileSync('android/app/src/main/assets/index.html','utf8');
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          if(scripts.length<2) throw Error('Missing offline engine or UI script');
          scripts.forEach((script,i)=>new vm.Script(script[1],{filename:'inline-'+i+'.js'}));
          for (const tag of ['PackingEngine','localStorage','WAYPACK','if(isNative)apiBase=','Content-Security-Policy'])
            if(!html.includes(tag)) throw Error('Missing required feature: '+tag);
          console.log('OK: '+scripts.length+' JS blocks parsed; native offline and Qwen backend preset present');
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile native application
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK integrity and package ID
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep 'package: name=.ai.waypack.app.'
          mkdir -p release
          cp "$APK" release/WAYPACK-AI-1.4.0.apk
          sha256sum release/WAYPACK-AI-1.4.0.apk > release/SHA256SUMS.txt
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAYPACK-AI-1.4.0-Android-APK
          path: release/*
          retention-days: 90
          if-no-files-found: error
      - name: Publish public one-click APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG=waypack-ai-android-v1.4.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/WAYPACK-AI-1.4.0.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" release/WAYPACK-AI-1.4.0.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "WAYPACK AI Android 1.4.0" --notes "Standalone Android APK. Offline packing planner works immediately without accounts or keys. Qwen augmentation is optional and requires an active hosted backend. Debug-signed test build, not a Play Store release."
          fi
