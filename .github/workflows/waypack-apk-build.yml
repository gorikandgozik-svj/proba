name: WAYPACK AI Android 1.5
on:
  push:
    branches: [waypack-ai-v1-5-cloud]
    paths:
      - 'android/**'
      - 'android-tests/**'
      - '.github/workflows/waypack-apk-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'android-tests/**'
      - '.github/workflows/waypack-apk-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled app scripts and offline features
        run: |
          node <<'NODE'
          const fs = require('fs'), vm = require('node:vm');
          const html = fs.readFileSync('android/app/src/main/assets/index.html','utf8');
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          if(scripts.length<1) throw Error('Missing offline engine or UI script');
          scripts.forEach((script,i)=>new vm.Script(script[1],{filename:'inline-'+i+'.js'}));
          for (const tag of ['PackingEngine','localStorage','WAYPACK','window.waypackCloudDone','startCloudAI','Content-Security-Policy'])
            if(!html.includes(tag)) throw Error('Missing required feature: '+tag);
          console.log('OK: '+scripts.length+' JS blocks parsed; offline rules, automatic cloud Qwen bridge and CSP present');
          NODE
      - name: Integration test automatic cloud UI and fallback
        run: node --test android-tests/cloud-ui.test.cjs
      - name: Verify native cloud providers
        run: |
          grep -q 'Qwen2.5-VL-72B-Instruct' android/app/src/main/java/ai/waypack/app/CloudAI.java
          grep -q 'Mistral-Small-3.2-24B-Instruct-2506' android/app/src/main/java/ai/waypack/app/CloudAI.java
          grep -q 'analyzeTrip' android/app/src/main/java/ai/waypack/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=""
          for bin in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if test -x "$bin"; then SDKMANAGER="$bin"; break; fi
          done
          test -x "$SDKMANAGER" || { echo "Android SDK command-line tools missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile native application
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK integrity and package ID
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep 'package: name=.ai.waypack.cloud.'
          mkdir -p release
          cp "$APK" release/WAYPACK-AI-1.5.0.apk
          sha256sum release/WAYPACK-AI-1.5.0.apk > release/SHA256SUMS.txt
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAYPACK-AI-1.5.0-Android-APK
          path: release/*
          retention-days: 90
          if-no-files-found: error
      - name: Publish public one-click APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG=waypack-ai-android-v1.5.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/WAYPACK-AI-1.5.0.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" release/WAYPACK-AI-1.5.0.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "WAYPACK AI Android 1.4.0" --notes "Standalone Android APK. Offline packing planner works immediately without accounts or keys. Qwen2.5-VL-72B-Instruct automatically analyzes packing via OVHcloud anonymous HTTPS API, with Mistral backup and offline deterministic list. Free anonymous cloud tier is rate-limited; no credentials required. Debug-signed Android APK; not Play Store release."
          fi
