name: WAYPACK Gemma 3.0 Android Quick Build
on:
  push:
    branches: [waypack-gemma-android-release]
    paths:
      - 'android/**'
      - '.github/workflows/waypack-gemma-android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/waypack-gemma-android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled app scripts and offline features
        run: |
          node <<'NODE'
          const fs = require('fs'), vm = require('node:vm');
          const html = fs.readFileSync('android/app/src/main/assets/index.html','utf8');
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          if(scripts.length<1) throw Error('Missing offline engine or UI script');
          scripts.forEach((script,i)=>new vm.Script(script[1],{filename:'inline-'+i+'.js'}));
          for (const tag of ['PackingEngine','localStorage','WAYPACK','if(isNative)apiBase=','waypackNativeResolve','runModel','Content-Security-Policy'])
            if(!html.includes(tag)) throw Error('Missing required feature: '+tag);
          console.log('OK: '+scripts.length+' JS blocks parsed; native offline and Gemma on-device bridge present');
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=""
          for bin in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if test -x "$bin"; then SDKMANAGER="$bin"; break; fi
          done
          test -x "$SDKMANAGER" || { echo "Android SDK command-line tools missing"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Retrieve verified Gemma 3 270M Q4 weights and llama.cpp native engine
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android/app/src/main/cpp/llama.cpp
          curl --fail --location --retry 4 --retry-delay 4 --output android/app/src/main/assets/model.gguf "https://huggingface.co/unsloth/gemma-3-270m-it-GGUF/resolve/41f492445cabbf71afac8c7b392aa2adb23ccc36/gemma-3-270m-it-Q4_K_M.gguf?download=true"
          MODEL=android/app/src/main/assets/model.gguf
          test "$(stat -c %s "$MODEL")" -gt 240000000
          test "$(head -c 4 "$MODEL")" = "GGUF"
          echo "b1baabd6b729e4041822220d3e648e00d99cac5df86b10dffb77bcccf0688e39  $MODEL" | sha256sum --check
          curl --fail --location --retry 3 --output android/app/src/main/assets/GEMMA_TERMS_OF_USE.txt "https://raw.githubusercontent.com/google-gemma/docs/main/docs/resources/terms.md"
          test "$(wc -c < android/app/src/main/assets/GEMMA_TERMS_OF_USE.txt)" -gt 5000
          git -C android/app/src/main/cpp/llama.cpp rev-parse HEAD
      - name: Compile native application
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK integrity and package ID
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep 'package: name=.ai.waypack.gemma.'
          mkdir -p release
          cp "$APK" release/WAYPACK-AI-GEMMA-3.0.0.apk
          cp android/app/src/main/assets/GEMMA_NOTICE.txt release/GEMMA_NOTICE.txt
          sha256sum release/WAYPACK-AI-GEMMA-3.0.0.apk > release/SHA256SUMS.txt
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAYPACK-AI-GEMMA-3.0.0-BETA-Android-APK
          path: release/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish public one-click APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG=waypack-ai-gemma-fast-v3.0.0-beta
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/WAYPACK-AI-GEMMA-3.0.0.apk release/SHA256SUMS.txt release/GEMMA_NOTICE.txt --clobber
          else
            gh release create "$TAG" release/WAYPACK-AI-GEMMA-3.0.0.apk release/SHA256SUMS.txt release/GEMMA_NOTICE.txt --target "$GITHUB_SHA" --title "WAYPACK AI Gemma Fast 3.0.0" --notes "Gemma 3 270M Q4 model included in APK with llama.cpp. Short 13-second inference timeout. Real inference smoke pending. Offline, no API keys. Model subject to Google Gemma Terms of Use: https://ai.google.dev/gemma/terms. ARM64 only. Debug-signed beta; actual Android device performance not yet verified."
          fi
